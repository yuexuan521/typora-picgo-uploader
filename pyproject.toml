[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typora-picgo-uploader"
version = "1.0.0"
description = "批量把 Markdown 里的本地图片上传到 PicGo 图床，并自动替换链接"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "yuexuan" }]
keywords = ["typora", "picgo", "markdown", "image-hosting", "obsidian"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yuexuan521/typora-picgo-uploader"
Issues = "https://github.com/yuexuan521/typora-picgo-uploader/issues"

[project.scripts]
typora-picgo-uploader = "typora_picgo_uploader.cli:main"

[tool.setuptools]
packages = ["typora_picgo_uploader"]
